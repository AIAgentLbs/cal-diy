services:
  web:
    image: ${CALDIY_IMAGE_NAME:?Set CALDIY_IMAGE_NAME}
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_WEBAPP_URL: ${NEXT_PUBLIC_WEBAPP_URL:?Set NEXT_PUBLIC_WEBAPP_URL}
      NEXTAUTH_URL: ${NEXT_PUBLIC_WEBAPP_URL:?Set NEXT_PUBLIC_WEBAPP_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET}
      CALENDSO_ENCRYPTION_KEY: ${CALENDSO_ENCRYPTION_KEY:?Set CALENDSO_ENCRYPTION_KEY}
      DATABASE_HOST: postgres:5432
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      ALLOWED_HOSTNAMES: ${ALLOWED_HOSTNAMES:?Set ALLOWED_HOSTNAMES}
      CALCOM_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_LICENSE_CONSENT: agree
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Календарь AI Data Extractor}
      NEXT_PUBLIC_SUPPORT_MAIL_ADDRESS: ${NEXT_PUBLIC_SUPPORT_MAIL_ADDRESS:-ms@aidataextractor.pro}
      NEXT_PUBLIC_COMPANY_NAME: ${NEXT_PUBLIC_COMPANY_NAME:-AI Data Extractor}
      NEXT_PUBLIC_WEBSITE_TERMS_URL: ${NEXT_PUBLIC_WEBSITE_TERMS_URL:-https://aidataextractor.pro}
      NEXT_PUBLIC_WEBSITE_PRIVACY_POLICY_URL: ${NEXT_PUBLIC_WEBSITE_PRIVACY_POLICY_URL:-https://aidataextractor.pro}
      NEXT_PUBLIC_DISABLE_SIGNUP: "true"
      NEXT_PUBLIC_POWERED_BY_URL: https://github.com/AIAgentLbs/cal-diy
      NEXT_PUBLIC_SOURCE_CODE_URL: https://github.com/AIAgentLbs/cal-diy
      NEXT_PUBLIC_FORCE_LOCALE: ru
      EMAIL_FROM: ${EMAIL_FROM:-calendar@aidataextractor.pro}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Календарь AI Data Extractor}
      EMAIL_SERVER_HOST: ${EMAIL_SERVER_HOST:-}
      EMAIL_SERVER_PORT: ${EMAIL_SERVER_PORT:-587}
      EMAIL_SERVER_USER: ${EMAIL_SERVER_USER:-}
      EMAIL_SERVER_PASSWORD: ${EMAIL_SERVER_PASSWORD:-}
      CRON_API_KEY: ${CRON_API_KEY:?Set CRON_API_KEY}
      CRON_SECRET: ${CRON_SECRET:?Set CRON_SECRET}
      SETUP_SECRET: ${SETUP_SECRET:?Set SETUP_SECRET}
      TASKER_ENABLE_WEBHOOKS: "1"
    command:
      - /bin/sh
      - -ec
      - |
        export DATABASE_URL="postgresql://cal:$${POSTGRES_PASSWORD}@postgres:5432/cal"
        export DATABASE_DIRECT_URL="$${DATABASE_URL}"
        exec /calcom/scripts/start.sh
    networks:
      cal-internal:
      aide-network:
        aliases:
          - cal-web
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s

  cron:
    image: ${CALDIY_IMAGE_NAME:?Set CALDIY_IMAGE_NAME}
    environment:
      CRON_API_KEY: ${CRON_API_KEY:?Set CRON_API_KEY}
      CRON_SECRET: ${CRON_SECRET:?Set CRON_SECRET}
    command:
      - /bin/sh
      - -ec
      - |
        until wget -qO- --header="Authorization: Bearer $${CRON_SECRET}" http://web:3000/api/tasks/cron; do sleep 15; done
        while true; do
          wget -qO- --header="Authorization: Bearer $${CRON_SECRET}" http://web:3000/api/tasks/cron || true
          wget -qO- --header="Authorization: $${CRON_API_KEY}" --post-data="" http://web:3000/api/cron/webhookTriggers || true
          sleep 60
        done
    networks:
      - cal-internal
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cal
      POSTGRES_USER: cal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - cal-postgres-data:/var/lib/postgresql/data
    networks:
      - cal-internal
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s

networks:
  cal-internal:
    driver: overlay
  aide-network:
    external: true
    name: deploy-stack_app-network

volumes:
  cal-postgres-data:
