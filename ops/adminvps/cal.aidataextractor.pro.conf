server {
    listen 80;
    server_name cal.aidataextractor.pro cal.aidataextractor.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://cal.aidataextractor.pro$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name cal.aidataextractor.pro;

    ssl_certificate /etc/letsencrypt/live/cal.aidataextractor.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cal.aidataextractor.pro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $cal_origin http://cal-web:3000;
        proxy_pass $cal_origin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}


server {
    listen 443 ssl http2;
    server_name cal.aidataextractor.ru;

    ssl_certificate /etc/letsencrypt/live/cal.aidataextractor.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cal.aidataextractor.pro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://cal.aidataextractor.pro$request_uri;
}
